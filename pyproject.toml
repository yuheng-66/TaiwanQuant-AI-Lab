[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwanquant-ai-lab"
version = "0.1.0"
description = "Reproducible Taiwan equity research workbench"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
twquant = "taiwanquant.__main__:main"

[tool.setuptools.packages.find]
include = ["taiwanquant*"]
